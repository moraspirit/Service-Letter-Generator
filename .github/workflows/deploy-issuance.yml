name: Deploy issuance app

# Vercel deploys apps/verify on its own via Git integration (architecture.md §1,
# "Build hygiene"). This workflow only handles the VPS half.
#
# The image is built here (GitHub's runners have real CPU/RAM, unlike the
# VPS) and pushed to GHCR. The VPS step is just a pull + restart.
on:
  push:
    branches: [main]
    paths:
      - "apps/issuance/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "docker-compose.yml"
      - ".github/workflows/deploy-issuance.yml"

env:
  REGISTRY: ghcr.io
  # Docker image names must be lowercase; github.repository preserves the
  # repo's actual casing (moraspirit/Service-Letter-Generator), so this is
  # hardcoded rather than derived.
  IMAGE_NAME: moraspirit/service-letter-generator-issuance

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/issuance/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH in, pull the new image, restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_APP_DIR }}
            git pull origin main
            docker compose pull issuance
            docker compose up -d issuance
            docker image prune -f
